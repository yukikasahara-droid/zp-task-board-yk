<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>ZPタスクボード</title>
  <link rel="stylesheet" href="assets/style.css">
  <script type="module" src="assets/app.js"></script>
</head>
<body>
  <!-- パスワード入力 -->
  <main id="lock" class="lock">
    <form id="lock-form" class="lock-card">
      <h1>ZPタスクボード</h1>
      <p class="muted">#zp-status-kasahara の指示タスク一覧です。<br>共有パスワードを入力してください。</p>
      <input id="pw" type="password" autocomplete="current-password" placeholder="パスワード" required>
      <label class="check"><input id="remember" type="checkbox" checked> この端末で記憶する</label>
      <button type="submit" id="unlock-btn">開く</button>
      <p id="lock-error" class="error" hidden></p>
    </form>
  </main>

  <!-- タスク一覧 -->
  <div id="app" hidden>
    <header class="top">
      <div class="top-inner">
        <h1>ZPタスクボード</h1>
        <span id="updated" class="muted small"></span>
        <button id="logout" class="link-btn small" type="button">ロック</button>
      </div>
    </header>

    <main class="wrap">
      <p class="howto">
        タスクの追加は <a href="https://orylab.slack.com/archives/C06FZL1TD99" target="_blank" rel="noopener">Slack #zp-status-kasahara</a> で
        <b>@担当者 にメンション</b>して依頼。完了したら元メッセージの<b>スレッドに「完了」</b>と返信（着手したら「着手」）。
        サイトへの反映は平日 9時・18時ごろです。
      </p>

      <section class="stats" id="stats"></section>

      <section class="filters">
        <input id="q" type="search" placeholder="キーワードで絞り込み">
        <select id="assignee"><option value="">担当者：全員</option></select>
        <div class="chips" id="status-chips"></div>
        <select id="sort">
          <option value="due">期限が近い順</option>
          <option value="new">指示日が新しい順</option>
        </select>
      </section>

      <div class="count-row">
        <p id="count" class="muted small"></p>
        <button id="copy-link" class="link-btn small" type="button">この表示のリンクをコピー</button>
      </div>
      <ul id="list" class="list"></ul>
    </main>
  </div>

  <noscript>このページを表示するには JavaScript を有効にしてください。</noscript>
</body>
</html>
